name: CI/CD

on:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          cd api
          pip install -r requirements.txt

      - name: Type check (mypy)
        run: |
          cd api
          mypy . --config-file mypy.ini

      - name: Lint (black)
        uses: rickstaa/action-black@v1
        with:
          args: api

      - name: Lint (flake8)
        run: |
          cd api
          flake8 common modules config main.py --max-line-length=88 --extend-ignore=E203,W503
