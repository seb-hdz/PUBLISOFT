name: CI/CD

on:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          cd api
          pip install -r requirements.txt

      - name: Type check (mypy)
        run: |
          cd api
          mypy . --config-file mypy.ini

      - name: Lint (black + flake8)
        run: |
          cd api
          black --check .
          flake8 .
